name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs this whole suite on the tagged commit before it
  # builds anything.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # The version is the one in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Scan tracked files for committed secrets
        run: npm run security:secrets
      - name: Require every release manifest to carry one version
        run: node scripts/check-release-versions.mjs
      - name: Require current third-party notices
        run: node scripts/third-party-notices.mjs --check
      - run: npm run test:all
        env:
          # The SDK tests run every documented example under the binary that
          # `cargo test` has just built; without it they would be skipped.
          PREMIER_REQUIRE_CLI: '1'
      - name: Lint shell scripts
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh sdk/shell/premier-emit.sh
      - run: ./scripts/tests/distribution.sh
      - run: ./scripts/tests/premier-emit.sh
      - run: node scripts/tests/preflight-npm-trusted-publishing.test.mjs
      - run: node --test scripts/tests/release-config.test.mjs scripts/tests/npm-staging.test.mjs

  # The recorder's PTY, signal and process-group code is platform-specific,
  # and half of the release targets are macOS: exercise it before a tag exists.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.1
      - run: cargo test --workspace --locked
      - run: node --test "packages/premier-cli/test/*.test.js"
      - run: ./scripts/tests/distribution.sh
      - run: ./scripts/tests/premier-emit.sh
